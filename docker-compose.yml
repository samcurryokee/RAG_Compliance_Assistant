# Local development database only. Production uses Supabase.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-pg
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
